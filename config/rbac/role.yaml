---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - policy.deploywindow.dev
  resources:
  - deploymentwindows
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - policy.deploywindow.dev
  resources:
  - deploymentwindows/finalizers
  verbs:
  - update
- apiGroups:
  - policy.deploywindow.dev
  resources:
  - deploymentwindows/status
  verbs:
  - get
  - patch
  - update
