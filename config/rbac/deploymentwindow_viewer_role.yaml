# This rule is not used by the project deploy-window-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to policy.deploywindow.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: deploy-window-operator
    app.kubernetes.io/managed-by: kustomize
  name: deploymentwindow-viewer-role
rules:
- apiGroups:
  - policy.deploywindow.dev
  resources:
  - deploymentwindows
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - policy.deploywindow.dev
  resources:
  - deploymentwindows/status
  verbs:
  - get
