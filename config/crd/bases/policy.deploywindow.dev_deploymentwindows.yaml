---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: deploymentwindows.policy.deploywindow.dev
spec:
  group: policy.deploywindow.dev
  names:
    kind: DeploymentWindow
    listKind: DeploymentWindowList
    plural: deploymentwindows
    shortNames:
    - dw
    singular: deploymentwindow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.open
      name: Open
      type: boolean
    - jsonPath: .status.matchedDeployments
      name: Matched
      type: integer
    - jsonPath: .status.nextTransition
      name: Next
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DeploymentWindow pauses selected Deployments outside allowed
          time windows.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DeploymentWindowSpec defines when the selected Deployments
              may roll out.
            properties:
              selector:
                description: Selector picks Deployments in the same namespace as this
                  object.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              suspend:
                description: |-
                  Suspend stops the controller from pausing anything and resumes any
                  Deployment it paused. Useful for an emergency fix outside a window.
                type: boolean
              timeZone:
                default: UTC
                description: TimeZone is an IANA name such as "Africa/Lagos". Defaults
                  to UTC.
                type: string
              windows:
                description: |-
                  Windows when rollouts are allowed. Outside all windows, the selected
                  Deployments are paused (spec.paused=true) so new rollouts wait.
                items:
                  description: Window is one period, on the given days, when rollouts
                    are allowed.
                  properties:
                    days:
                      description: Days the window applies to. Three-letter English
                        names.
                      items:
                        enum:
                        - Mon
                        - Tue
                        - Wed
                        - Thu
                        - Fri
                        - Sat
                        - Sun
                        type: string
                      minItems: 1
                      type: array
                    end:
                      description: |-
                        End time in 24-hour HH:MM, in spec.timeZone. Must be after start;
                        windows do not cross midnight (use two windows instead).
                      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                      type: string
                    start:
                      description: Start time in 24-hour HH:MM, in spec.timeZone.
                      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                      type: string
                  required:
                  - days
                  - end
                  - start
                  type: object
                minItems: 1
                type: array
            required:
            - selector
            - windows
            type: object
          status:
            description: DeploymentWindowStatus is the observed state of a DeploymentWindow.
            properties:
              conditions:
                description: 'Conditions: "Ready" reports whether the spec is valid
                  and was applied.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              matchedDeployments:
                description: MatchedDeployments is how many Deployments the selector
                  matches.
                format: int32
                type: integer
              nextTransition:
                description: NextTransition is when Open will next change.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
              open:
                description: Open is true when rollouts are currently allowed.
                type: boolean
              pausedDeployments:
                description: PausedDeployments lists the Deployments this window has
                  paused.
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
